# Note types Akasha generates. Read by scripts/lib/schema.py with tomllib.
# Adding an area starts here: add a [types.<name>] table, then a template and a skill.
#
# Field kinds: "string", "int", "bool", "date" (YYYY-MM-DD string), "list" (list of scalars).
# Each type's frontmatter must contain every field in `common` plus its own `required`,
# its `status` must be one of `statuses`, and its path must sit under `folder`.

version = 1

common = ["type", "title", "status", "created", "updated", "tags", "generated"]

[fields]
type = "string"
title = "string"
status = "string"
created = "date"
updated = "date"
tags = "list"
generated = "bool"
aliases = "list"
raw = "string"
origin = "string"
kind = "string"
sources = "list"
asked = "date"
course = "string"
built_from = "list"
next_action = "string"
last_touched = "date"

[types.source]
folder = "wiki/sources"
required = ["raw", "origin", "kind"]
statuses = ["ingested"]

[types.concept]
folder = "wiki/concepts"
required = ["sources"]
statuses = ["seed", "developing", "evergreen", "contested"]

[types.entity]
folder = "wiki/entities"
required = ["sources"]
statuses = ["seed", "developing", "evergreen"]

[types.question]
folder = "wiki/questions"
required = ["asked"]
statuses = ["answered", "open"]

# Course pages live one level down: wiki/courses/<code>/summary.md
[types.course]
folder = "wiki/courses"
subfolder = true
required = ["course", "built_from"]
statuses = ["current", "stale"]

[types.project]
folder = "wiki/projects"
required = ["next_action", "last_touched"]
statuses = ["active", "paused", "done"]
